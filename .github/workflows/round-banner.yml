name: Round banner corners

on:
  push:
    paths:
      - "images/projects-banner-github.jpeg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  round:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - run: python scripts/round_corners.py

      - name: Commit resultaat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/banner-rounded.png
          git diff --staged --quiet || git commit -m "Round banner corners"
          git push
